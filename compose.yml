services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fuelclub
      POSTGRES_USER: fuelclub
      POSTGRES_PASSWORD: fuelclub_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelclub -d fuelclub"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: fuelclub_test
      POSTGRES_USER: fuelclub_test
      POSTGRES_PASSWORD: fuelclub_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelclub_test -d fuelclub_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Optional local trace viewer (OTLP/HTTP on :6006/v1/traces, UI on :6006; PHOENIX_PORT changes it).
  # Not started by default:
  # docker compose --profile observability up -d phoenix. No volume: traces live as long as the container.
  phoenix:
    image: arizephoenix/phoenix@sha256:cc8c5e545389a6aae9523beaf92eb067fdaeae59d2166093d60856f89bf7ee34 # arize-phoenix-v22.0.1
    profiles: ["observability"]
    environment:
      # Local viewer bound to 127.0.0.1 only; with auth on, export would also need an API key.
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"

volumes:
  postgres_data:
  postgres_test_data:
