name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Own throwaway PostgreSQL per job; no dev database, no cloud keys (the chat runs on the demo adapter).
env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  api:
    name: API (tests, evals, format)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuelclub_test
          POSTGRES_USER: fuelclub_test
          POSTGRES_PASSWORD: fuelclub_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fuelclub_test -d fuelclub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FUELCLUB_TEST_DATABASE: Host=localhost;Port=5434;Database=fuelclub_test;Username=fuelclub_test;Password=fuelclub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - name: Format (CSharpier)
        run: dotnet csharpier check apps
      - name: Tests and evals (assistant-evals-v2 run inside the suite)
        run: dotnet test apps/api.tests

  web:
    name: Web (types, lint, format, OpenAPI drift, E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuelclub_test
          POSTGRES_USER: fuelclub_test
          POSTGRES_PASSWORD: fuelclub_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fuelclub_test -d fuelclub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: dotnet tool restore
        working-directory: .
      - run: dotnet restore apps/api
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Generated API types match the API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5434;Database=fuelclub_types;Username=fuelclub_test;Password=fuelclub_test
        run: |
          dotnet tool run dotnet-ef database update --project ../api --connection "$ConnectionStrings__DefaultConnection"
          dotnet run --project ../api --no-launch-profile --urls http://localhost:5299 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://localhost:5299/openapi/v1.json && break; sleep 1; done
          OPENAPI_URL=http://localhost:5299/openapi/v1.json npm run api:types
          git diff --exit-code -- lib/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - name: E2E (own API and Next, database fuelclub_e2e)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  images:
    name: Docker images (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t fuelclub-api .
      - run: docker build --build-arg API_INTERNAL_URL=http://api:8080 -t fuelclub-web apps/web

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
