name: Deploy

# Continuous delivery (ADR 0022): after a green CI run on main, the same commit goes to Cloud Run.
# No stored keys: GitHub's OIDC token is exchanged through Workload Identity Federation, which
# trusts only this repository on refs/heads/main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, never cancelled half-way (a migration may be running).
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: fuelclub-demo-a0999e
  REGION: europe-central2
  REPO: europe-central2-docker.pkg.dev/fuelclub-demo-a0999e/fuelclub
  # The api service's internal address, baked into the web image (Next rewrite).
  API_URL: https://fuelclub-api-407499358574.europe-central2.run.app
  WEB_URL: https://fuelclub-web-407499358574.europe-central2.run.app

jobs:
  deploy:
    name: Cloud Run (images, migration, api, web)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/407499358574/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@fuelclub-demo-a0999e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-central2-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          docker build -f apps/api/Dockerfile -t "$REPO/api:$TAG" .
          docker build --build-arg API_INTERNAL_URL="$API_URL" -t "$REPO/web:$TAG" apps/web
          docker push "$REPO/api:$TAG"
          docker push "$REPO/web:$TAG"

      # Before the new api revision: the API never migrates itself. A failed migration stops here.
      - name: Migrate the database
        run: |
          gcloud run jobs update fuelclub-migrate --project "$PROJECT" --region "$REGION" --image "$REPO/api:$TAG"
          gcloud run jobs execute fuelclub-migrate --project "$PROJECT" --region "$REGION" --wait

      - name: Deploy api and web
        run: |
          gcloud run deploy fuelclub-api --project "$PROJECT" --region "$REGION" --image "$REPO/api:$TAG"
          gcloud run deploy fuelclub-web --project "$PROJECT" --region "$REGION" --image "$REPO/web:$TAG"

      - name: Smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/login")" = 200
          # 401 comes from the api: web reaches it over the VPC.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/api/auth/me")" = 401
          # The api has no public address.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/auth/me")" = 404
          echo "Deployed $TAG"
