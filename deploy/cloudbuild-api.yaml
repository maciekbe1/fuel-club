# gcloud builds submit --config deploy/cloudbuild-api.yaml --substitutions _TAG=$(git rev-parse --short HEAD) .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_REPO}/api:${_TAG}", "."]
images: ["${_REPO}/api:${_TAG}"]
substitutions:
  _REPO: europe-central2-docker.pkg.dev/fuelclub-demo-a0999e/fuelclub
options:
  machineType: E2_HIGHCPU_8
