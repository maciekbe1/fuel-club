# gcloud builds submit --config deploy/cloudbuild-web.yaml --substitutions _TAG=$(git rev-parse --short HEAD) apps/web
# API_INTERNAL_URL is baked into the image (Next rewrite): the internal address of the api service.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "API_INTERNAL_URL=${_API_URL}", "-t", "${_REPO}/web:${_TAG}", "."]
images: ["${_REPO}/web:${_TAG}"]
substitutions:
  _REPO: europe-central2-docker.pkg.dev/fuelclub-demo-a0999e/fuelclub
  _API_URL: https://fuelclub-api-407499358574.europe-central2.run.app
options:
  machineType: E2_HIGHCPU_8
